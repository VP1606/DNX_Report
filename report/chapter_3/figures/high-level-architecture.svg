<text x="560" y="648" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:12px;font-weight:500">Continuous Backbone</text>
