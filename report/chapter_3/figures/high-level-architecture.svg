<rect x="405" y="604" width="42" height="16" rx="4" fill="rgb(83, 74, 183)" opacity="0.10"/>
<text x="426" y="612" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:9.5px;font-weight:600;letter-spacing:0.8px">CNN</text>

