<text x="220" y="624" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:15px;font-weight:600">DetectorNX-G3-SNN</text>
<text x="220" y="648" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:12px;font-weight:500">Spiking Backbone</text>
