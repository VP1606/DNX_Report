    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Raw data (beige I/O) -->
<rect x="225" y="30" width="330" height="78" rx="10" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.8"/>
<text x="390" y="58" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:15px;font-weight:600">Raw ETRAM Data</text>
<text x="390" y="82" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:12px;font-weight:400">High-definition event stream — 1280 × 720</text>

<line x1="390" y1="108" x2="390" y2="168" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5"/>

<!-- Preprocessing group (dashed purple) -->
<rect x="207" y="170" width="366" height="356" rx="12" fill="rgb(244, 244, 252)" stroke="rgb(83, 74, 183)" stroke-width="1" stroke-dasharray="4 3" opacity="0.9"/>
<text x="193" y="348" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 193 348)" style="fill:rgb(83, 74, 183);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:13px;font-weight:600;letter-spacing:0.5px">PRE-PROCESSING PIPELINE (BOLT)</text>

<!-- Step 1: Noise Filtering -->
<rect x="225" y="192" width="330" height="78" rx="10" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="1.0"/>
