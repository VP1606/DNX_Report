<line x1="390" y1="526" x2="390" y2="560" stroke="rgb(115, 114, 108)" stroke-width="1.5"/>
<line x1="220" y1="560" x2="560" y2="560" stroke="rgb(115, 114, 108)" stroke-width="1.5"/>
