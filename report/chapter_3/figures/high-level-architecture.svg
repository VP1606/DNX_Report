<text x="390" y="244" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Polarity normalisation + BAF denoising</text>
<rect x="235" y="202" width="52" height="16" rx="4" fill="rgb(83, 74, 183)" opacity="0.10"/>
<text x="261" y="210" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:9.5px;font-weight:600;letter-spacing:0.8px">STEP 1</text>

<line x1="390" y1="270" x2="390" y2="306" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5"/>

<!-- Step 2: Voxel Grid -->
<rect x="225" y="308" width="330" height="78" rx="10" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="1.0"/>
<text x="390" y="336" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:15px;font-weight:600">Voxel Grid Representation</text>
<text x="390" y="360" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Bilinear interpolation — T = 10 time bins</text>
<rect x="235" y="318" width="52" height="16" rx="4" fill="rgb(83, 74, 183)" opacity="0.10"/>
<text x="261" y="326" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:9.5px;font-weight:600;letter-spacing:0.8px">STEP 2</text>

<line x1="390" y1="386" x2="390" y2="422" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5"/>

<!-- Step 3: Spatial Downsampling (FIXED: 320x180) -->
<rect x="225" y="424" width="330" height="78" rx="10" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="1.0"/>
<text x="390" y="452" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:15px;font-weight:600">Spatial Downsampling</text>
<text x="390" y="476" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:12px;font-weight:400">1280 × 720  →  320 × 180</text>
<rect x="235" y="434" width="52" height="16" rx="4" fill="rgb(83, 74, 183)" opacity="0.10"/>
<text x="261" y="442" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:9.5px;font-weight:600;letter-spacing:0.8px">STEP 3</text>

